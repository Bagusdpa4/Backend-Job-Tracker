openapi: 3.0.3
info:
  title: Job Application Tracker API
  description: API untuk mencatat dan melacak lamaran kerja
  version: 1.0.0

servers:
  - url: https://backend-job-application-tracker.vercel.app/api/v1
    description: Production

tags:
  - name: Auth
    description: Registrasi dan login user
  - name: Applications
    description: CRUD dan filter data lamaran kerja

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrasi user baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: Bagus
                email:
                  type: string
                  format: email
                  example: bagus@email.com
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: password123
      responses:
        "201":
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          description: Validasi gagal (field kosong / format email invalid / password < 6 karakter)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: bagus@email.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        "200":
          description: Login berhasil, token berlaku 2 jam
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/User"
                          - type: object
                            properties:
                              token:
                                type: string
                                description: JWT, expired dalam 2 jam
        "400":
          description: Email atau password kosong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /applications:
    get:
      tags: [Applications]
      summary: Ambil daftar lamaran (dengan filter, search, dan pagination)
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Cari di field company atau position (case-insensitive, partial match)
          schema:
            type: string
        - name: status
          in: query
          description: Filter berdasarkan status (exact match)
          schema:
            $ref: "#/components/schemas/ApplicationStatus"
        - name: source
          in: query
          description: Filter berdasarkan sumber lamaran (case-insensitive, exact match)
          schema:
            type: string
        - name: city
          in: query
          description: Filter berdasarkan kota (case-insensitive, partial match)
          schema:
            type: string
        - name: startDate
          in: query
          description: Filter appliedDate >= startDate (format YYYY-MM-DD, WIB)
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Filter appliedDate <= endDate (format YYYY-MM-DD, WIB)
          schema:
            type: string
            format: date
        - name: page
          in: query
          description: Halaman ke berapa (default 1)
          schema:
            type: integer
            default: 1
        - name: all
          in: query
          description: "Jika 'true' atau '1', matikan pagination dan balikin semua data yang match filter"
          schema:
            type: string
            enum: ["true", "1"]
      responses:
        "200":
          description: Berhasil mengambil data lamaran
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/JobApplication"
                      pagination:
                        $ref: "#/components/schemas/Pagination"
        "400":
          description: Status filter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      tags: [Applications]
      summary: Tambah lamaran baru
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobApplicationInput"
      responses:
        "201":
          description: Lamaran berhasil ditambahkan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/JobApplication"
        "400":
          description: Field wajib (company, position, source, appliedDate) belum diisi, atau status tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /applications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string

    get:
      tags: [Applications]
      summary: Ambil detail satu lamaran
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Berhasil mengambil detail lamaran
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/JobApplication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Lamaran tidak ditemukan / bukan milik user ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      tags: [Applications]
      summary: Update lamaran
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobApplicationInput"
      responses:
        "200":
          description: Lamaran berhasil diperbarui
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/JobApplication"
        "400":
          description: Status tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Lamaran tidak ditemukan / bukan milik user ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [Applications]
      summary: Hapus lamaran
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lamaran berhasil dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Lamaran tidak ditemukan / bukan milik user ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token didapat dari /auth/login, kirim di header: Authorization: Bearer <token>. Expired setelah 2 jam."

  responses:
    Unauthorized:
      description: Token tidak ditemukan / tidak valid / sudah expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Terjadi kesalahan di server
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ApplicationStatus:
      type: string
      enum:
        - applied
        - test
        - interview HRD
        - interview User
        - offer
        - rejected

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string

    JobApplication:
      type: object
      properties:
        id:
          type: string
        company:
          type: string
        position:
          type: string
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        source:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        salaryRange:
          type: string
          nullable: true
        appliedDate:
          type: string
          description: "Format tampilan WIB, contoh: 'Kamis, 17 September 2026'"
        notes:
          type: string
          nullable: true

    JobApplicationInput:
      type: object
      required: [company, position, source, appliedDate]
      properties:
        company:
          type: string
          example: PT Intersolusi Teknologi Asia
        position:
          type: string
          example: JavaScript Developer
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        source:
          type: string
          example: LinkedIn
        city:
          type: string
          example: Jakarta
        salaryRange:
          type: string
          example: "8-12 juta"
        appliedDate:
          type: string
          format: date
          example: "2026-09-17"
        notes:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    SuccessResponse:
      type: object
      properties:
        status:
          type: boolean
          example: true
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        status:
          type: boolean
          example: false
        message:
          type: string